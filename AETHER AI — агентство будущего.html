<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const cn = (...a) => a.filter(Boolean).join(" ");

/* ================= hooks ================= */
function useScramble(text, { delay = 0, speed = 28 } = {}) {
  const [out, setOut] = useState("");
  useEffect(() => {
    const chars = "!<>-_\\/[]{}—=+*^?#01";
    let frame = 0, raf, last = 0, t0;
    const total = text.length * 3;
    const tick = (ts) => {
      t0 = t0 ?? ts;
      if (ts - t0 < delay) return (raf = requestAnimationFrame(tick));
      if (ts - last > speed) {
        last = ts; frame++;
        const done = Math.floor(frame / 3);
        setOut(text.split("").map((c, i) => c === " " ? " " : i < done ? c : chars[Math.floor(Math.random() * chars.length)]).join(""));
      }
      if (frame <= total) raf = requestAnimationFrame(tick); else setOut(text);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [text, delay, speed]);
  return out;
}

/* ================= ui/scramble-text ================= */
function ScrambleText({ text, className, delay = 0 }) {
  const out = useScramble(text, { delay });
  return <span className={className} aria-label={text}>{out || "\u00A0"}</span>;
}

/* ================= ui/magnetic ================= */
function Magnetic({ children, strength = 0.35, className }) {
  const ref = useRef(null);
  const move = (e) => {
    const el = ref.current, r = el.getBoundingClientRect();
    const x = (e.clientX - (r.left + r.width / 2)) * strength;
    const y = (e.clientY - (r.top + r.height / 2)) * strength;
    el.style.transform = `translate(${x}px, ${y}px)`;
  };
  const leave = () => { ref.current.style.transform = "translate(0,0)"; };
  return (
    <div ref={ref} onMouseMove={move} onMouseLeave={leave} data-magnetic
      className={cn("inline-block transition-transform duration-300 ease-out", className)}>
      {children}
    </div>
  );
}

/* ================= ui/glow-button ================= */
function GlowButton({ children, variant = "primary", className, ...p }) {
  const styles = variant === "primary"
    ? "bg-neon-blue text-void shadow-neon-blue hover:shadow-neon-blue-lg font-semibold"
    : "glass text-white hover:border-neon-blue/40 hover:shadow-neon-violet";
  return (
    <button {...p} className={cn("btn-glow rounded-full px-7 py-3.5 text-sm tracking-wide transition-shadow duration-500", styles, className)}>
      {children}
    </button>
  );
}

/* ================= ui/hud-cursor ================= */
function HudCursor() {
  const ring = useRef(null), dot = useRef(null);
  useEffect(() => {
    if (!window.matchMedia("(hover:hover) and (pointer:fine)").matches) return;
    document.documentElement.classList.add("hud");
    const pos = { x: innerWidth / 2, y: innerHeight / 2 }, tgt = { ...pos };
    let raf;
    const onMove = (e) => {
      tgt.x = e.clientX; tgt.y = e.clientY;
      dot.current.style.transform = `translate(${tgt.x}px,${tgt.y}px)`;
      const hit = e.target.closest && e.target.closest("a,button,[data-magnetic],[data-hover]");
      ring.current.classList.toggle("active", !!hit);
    };
    const down = () => ring.current.classList.add("down");
    const up = () => ring.current.classList.remove("down");
    const loop = () => {
      pos.x += (tgt.x - pos.x) * 0.16; pos.y += (tgt.y - pos.y) * 0.16;
      ring.current.style.transform = `translate(${pos.x}px,${pos.y}px)`;
      raf = requestAnimationFrame(loop);
    };
    addEventListener("mousemove", onMove); addEventListener("mousedown", down); addEventListener("mouseup", up);
    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf); document.documentElement.classList.remove("hud");
      removeEventListener("mousemove", onMove); removeEventListener("mousedown", down); removeEventListener("mouseup", up);
    };
  }, []);
  return (<>
    <div ref={ring} className="hud-ring"><i/><i/><i/><i/></div>
    <div ref={dot} className="hud-dot" />
  </>);
}

/* ================= sections/hero/hero-sphere (Three.js) ================= */
function HeroSphere({ onReady }) {
  const mount = useRef(null);
  useEffect(() => {
    const el = mount.current;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 6.2;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    el.appendChild(renderer.domElement);

    const group = new THREE.Group(); scene.add(group);
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.5, 4),
      new THREE.MeshBasicMaterial({ color: 0x00d2ff, wireframe: true, transparent: true, opacity: 0.35 })
    );
    const inner = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.1, 1),
      new THREE.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true, transparent: true, opacity: 0.55 })
    );
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.9, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.08 })
    );
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.25, 0.006, 8, 160),
      new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.7 })
    );
    ring.rotation.x = Math.PI / 2.4;
    const ring2 = ring.clone(); ring2.scale.setScalar(1.25); ring2.rotation.set(Math.PI / 1.8, 0.4, 0);
    ring2.material = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.5 });
    group.add(core, inner, glow, ring, ring2);

    const N = 900, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = 2.6 + Math.random() * 2.4, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const stars = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x9fe8ff, size: 0.018, transparent: true, opacity: 0.8 }));
    scene.add(stars);

    const resize = () => {
      const w = el.clientWidth, h = el.clientHeight;
      renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(el);

    const m = { x: 0, y: 0, tx: 0, ty: 0 };
    const onMove = (e) => { m.tx = (e.clientX / innerWidth - 0.5) * 2; m.ty = (e.clientY / innerHeight - 0.5) * 2; };
    addEventListener("pointermove", onMove);

    let visible = true;
    const io = new IntersectionObserver(([en]) => (visible = en.isIntersecting)); io.observe(el);

    const clock = new THREE.Clock(); let raf;
    const loop = () => {
      raf = requestAnimationFrame(loop);
      if (!visible) return;
      const t = clock.getElapsedTime();
      m.x += (m.tx - m.x) * 0.05; m.y += (m.ty - m.y) * 0.05;
      core.rotation.y = t * 0.12; core.rotation.x = t * 0.05;
      inner.rotation.y = -t * 0.2; inner.rotation.z = t * 0.08;
      ring.rotation.z = t * 0.25; ring2.rotation.z = -t * 0.18;
      stars.rotation.y = t * 0.02;
      const s = 1 + Math.sin(t * 1.6) * 0.04; glow.scale.setScalar(s);
      group.rotation.y = m.x * 0.5; group.rotation.x = m.y * 0.3;
      group.position.y = Math.sin(t * 0.8) * 0.08;
      renderer.render(scene, camera);
    };
    loop(); onReady && onReady();

    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); removeEventListener("pointermove", onMove);
      scene.traverse((o) => { o.geometry && o.geometry.dispose(); o.material && o.material.dispose(); });
      renderer.dispose(); el.removeChild(renderer.domElement);
    };
  }, []);
  return <div ref={mount} className="absolute inset-0" />;
}

                <span key={t + k} className="flex items-center gap-12">{t}<span className="text-neon-blue">◆</span></span>
              ))}
            </div>
          ))}
        </div>
      </div>

  );
}

/* ================= shared ================= */
const NAV = [["services", "Услуги"], ["cases", "Кейсы"], ["metrics", "Метрики"], ["dashboard", "Кабинет"]];

function PageHead({ label, title, sub }) {

function BentoCard({ className, children, delay = 0 }) {
  const ref = useRef(null);
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--mx", `${e.clientX - r.left}px`);
    ref.current.style.setProperty("--my", `${e.clientY - r.top}px`);
  };
  return (
    <div ref={ref} onMouseMove={move} data-hover style={{ animationDelay: `${delay}s` }}
      className={cn("bento glass animate-reveal-up p-7", className)}>{children}</div>
  );
}

function Count({ to, prefix = "", suffix = "" }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, t0;
    const f = (t) => {
      t0 = t0 ?? t;
      const p = Math.min((t - t0) / 1600, 1);
      setV(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(f);
    };
    raf = requestAnimationFrame(f);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  return <>{prefix}{v.toLocaleString("ru-RU")}{suffix}</>;
}

function buildReport(text) {
  const p = text.toLowerCase();
  const T = /поддерж|клиент|чат/.test(p) ? { t: "Агент клиентской поддержки", g: "−58% нагрузки на операторов", s: ["LLM", "RAG", "Python", "Supabase"] }
    : /склад|логист|достав/.test(p) ? { t: "Агент-диспетчер логистики", g: "+36% скорость доставки", s: ["AI Agents", "Python", "pgvector", "Next.js"] }
    : /продаж|лид|crm/.test(p) ? { t: "Агент квалификации лидов", g: "+24% конверсия в сделку", s: ["LLM", "CRM API", "Next.js", "Supabase"] }
    : { t: "Универсальный ИИ-агент", g: "−40% рутинных операций", s: ["LLM", "RAG", "Python", "Next.js"] };
  return {
    ...T, conf: 88 + (text.length % 9),
    short: text.length > 90 ? text.slice(0, 90) + "…" : text,
    plan: [["Неделя 1", "Аудит данных и процессов"], ["Недели 2–3", "Прототип агента и RAG-слой"], ["Недели 4–5", "Интеграции и тестирование"], ["Неделя 6", "Запуск и мониторинг"]],
    risks: [["Качество данных", "Автоочистка и валидация схем"], ["Галлюцинации", "Цитирование источников и guardrails"]]
  };
}

const PRESETS = ["Автоматизировать поддержку клиентов в чате", "Оптимизировать логистику склада", "Квалифицировать лиды из CRM"];

function Playground() {
  const [prompt, setPrompt] = useState("");
  const [phase, setPhase] = useState("idle");
  const [logs, setLogs] = useState([]);
  const [prog, setProg] = useState(0);
  const [rep, setRep] = useState(null);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
  const run = () => {
    const text = prompt.trim();
    if (!text || phase === "thinking") return;
    timers.current.forEach(clearTimeout); timers.current = [];
    setPhase("thinking"); setLogs([]); setRep(null); setProg(0);
    const short = text.length > 34 ? text.slice(0, 34) + "…" : text;
    const steps = [`> tokenize("${short}")`, "> embed(intent, dim=3072) ... ok", "> retrieve(knowledge_base, k=8)", "> plan(agent_graph) → 4 nodes", "> simulate(workflow, runs=1000)", "> evaluate(risk, cost, roi)", "> compose(report) ✓"];
    steps.forEach((s, i) => later(() => setLogs((l) => [...l, s]), i * 280));
    later(() => setProg(100), 30);
    later(() => { setRep(buildReport(text)); setPhase("done"); }, 2000);
  };
  return (
    <BentoCard className="mt-4" delay={0.15}>
      <div className="mb-5 flex items-center justify-between">
        <div className="hud-label flex items-center gap-3"><span className="h-2 w-2 animate-pulse rounded-full bg-neon-blue shadow-neon-blue" />AI Playground // SIM-4.2</div>
        <div className="font-mono text-[11px] text-[#8a8a96]">{prompt.length}/400</div>
      </div>
      <div className="mb-4 flex flex-wrap gap-2">
        {PRESETS.map((p) => (
          <button key={p} type="button" onClick={() => setPrompt(p)} className="rounded-full border border-white/10 px-3 py-1.5 text-xs text-[#8a8a96] transition-colors hover:border-neon-blue/40 hover:text-white">{p}</button>
        ))}
      </div>
      <textarea className="field font-mono text-sm" rows="3" maxLength={400} value={prompt} onChange={(e) => setPrompt(e.target.value)}
        onKeyDown={(e) => (e.ctrlKey || e.metaKey) && e.key === "Enter" && run()}
        placeholder="Опишите задачу для ИИ-агента… (Ctrl + Enter — запуск)" />
      <div className="mt-4 flex items-center gap-4">
        <Magnetic strength={0.2}>
          <GlowButton onClick={run} disabled={!prompt.trim() || phase === "thinking"} className="disabled:cursor-not-allowed disabled:opacity-40">
            {phase === "thinking" ? "Симуляция…" : "Запустить симуляцию"}
          </GlowButton>
        </Magnetic>
        {phase === "thinking" && <div className="h-5 w-5 animate-spin rounded-full border-2 border-neon-blue/20 border-t-neon-blue" />}
      </div>

      {phase !== "idle" && (
        <div className="mt-6 animate-reveal-up rounded-2xl border border-white/[0.08] bg-black/50 p-5">
          <div className="mb-3 h-1 overflow-hidden rounded-full bg-white/[0.06]">
            <div className="h-full bg-gradient-to-r from-neon-violet to-neon-blue shadow-neon-blue transition-all duration-[2000ms] ease-linear" style={{ width: `${prog}%` }} />
          </div>
          <div className="font-mono text-xs leading-7 text-neon-blue/90">
            {logs.map((l, i) => <div key={i}><ScrambleText text={l} /></div>)}
            {phase === "thinking" && <span className="animate-blink">▍</span>}
          </div>
        </div>
      )}

      {rep && (
        <div className="mt-5 space-y-5">
          <div className="animate-reveal-up rounded-2xl border border-neon-blue/30 bg-neon-blue/[0.05] p-6">
            <div className="hud-label mb-2">// Резюме · уверенность {rep.conf}%</div>
            <h4 className="font-display text-2xl font-bold">{rep.t}</h4>
            <p className="mt-2 text-[#c4c4cc]">Задача «{rep.short}» распознана. Прогноз эффекта: <span className="text-neon-blue">{rep.g}</span>.</p>
          </div>
          <div className="grid gap-4 md:grid-cols-2">
            <div className="animate-reveal-up rounded-2xl border border-white/[0.08] p-5" style={{ animationDelay: ".1s" }}>
              <div className="hud-label mb-4">// План внедрения</div>
              <ol className="space-y-3">
                {rep.plan.map(([w, t], i) => (
                  <li key={w} className="flex gap-3 text-sm"><span className="font-mono text-neon-blue">0{i + 1}</span><span><b className="font-medium">{w}</b> — <span className="text-[#8a8a96]">{t}</span></span></li>
                ))}
              </ol>
            </div>
            <div className="animate-reveal-up rounded-2xl border border-white/[0.08] p-5" style={{ animationDelay: ".2s" }}>
              <div className="hud-label mb-4">// Риски и меры</div>
              <ul className="space-y-3">
                {rep.risks.map(([r, m]) => <li key={r} className="text-sm"><b className="font-medium">{r}</b><div className="text-[#8a8a96]">{m}</div></li>)}
              </ul>
              <div className="hud-label mb-3 mt-5">// Рекомендуемый стек</div>
              <div className="flex flex-wrap gap-2">{rep.s.map((s) => <span key={s} className="rounded-full border border-neon-blue/30 bg-neon-blue/10 px-3 py-1 font-mono text-xs text-neon-blue">{s}</span>)}</div>
            </div>
          </div>
        </div>
      )}
    </BentoCard>
  );
}

/* ================= brief ================= */
const DIRS = [
  { id: "llm", icon: "◈", title: "Интеграция LLM", sub: "Языковые модели в ваших данных и процессах", base: 18000 },
  { id: "agent", icon: "⬡", title: "Автономный агент", sub: "Агент, который планирует и действует сам", base: 32000 },
  { id: "design", icon: "✦", title: "Нейро-дизайн", sub: "Генеративные интерфейсы и бренд-системы", base: 14000 }
];
const SCALES = [
  { id: "startup", icon: "◇", title: "Стартап", sub: "До 50 человек, быстрый MVP", mult: 1 },
  { id: "mid", icon: "◆", title: "Средний бизнес", sub: "50–500 человек, несколько интеграций", mult: 1.8 },
  { id: "ent", icon: "✺", title: "Энтерпрайз", sub: "500+ человек, безопасность и аудит", mult: 3.2 }
];
const TIERS = [
  { id: "base", title: "Базовый", sub: "Основной функционал", mult: 1 },
  { id: "pro", title: "Продвинутый", sub: "+ интеграции и аналитика", mult: 1.35 },
  { id: "prem", title: "Премиум", sub: "+ поддержка 24/7 и SLA", mult: 1.8 }
];
const fmt = (n) => Math.round(n).toLocaleString("ru-RU");
function calcCost(dir, scale, tier, weeks) {
  const rush = weeks < 8 ? 1 + (8 - weeks) * 0.06 : weeks > 16 ? 0.95 : 1;
  return Math.round((dir.base * scale.mult * tier.mult * rush) / 500) * 500;
}

function Pick({ active, onClick, icon, title, sub }) {
  const ref = useRef(null);
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--mx", `${e.clientX - r.left}px`);
    ref.current.style.setProperty("--my", `${e.clientY - r.top}px`);
  };
  return (
    <button ref={ref} type="button" onClick={onClick} onMouseMove={move} aria-pressed={active}
      className={cn("bento glass p-6 text-left", active && "!border-neon-blue shadow-neon-blue")}>
      <div className="mb-4 flex items-start justify-between">
        {icon && <div className="flex h-11 w-11 items-center justify-center rounded-2xl border border-neon-blue/30 bg-neon-blue/10 text-xl text-neon-blue">{icon}</div>}
        <span className={cn("ml-auto flex h-6 w-6 items-center justify-center rounded-full border text-xs transition-all", active ? "border-neon-blue bg-neon-blue text-void" : "border-white/20 text-transparent")}>✓</span>
      </div>
      <div className="font-display text-xl font-bold">{title}</div>
      <div className="mt-1 text-sm text-[#8a8a96]">{sub}</div>
    </button>
  );
}

function HudSuccess({ id, onHome }) {
  const [draw, setDraw] = useState(false);
  useEffect(() => { const t = setTimeout(() => setDraw(true), 80); return () => clearTimeout(t); }, []);
  return (
    <div className="flex animate-reveal-up flex-col items-center py-10 text-center">
      <div className="relative flex h-40 w-40 items-center justify-center">
        <span className="absolute inset-0 animate-ping rounded-full border border-neon-blue/40" />
        <span className="absolute inset-3 animate-[spin_10s_linear_infinite] rounded-full border border-dashed border-neon-blue/60" />
        <span className="absolute inset-8 animate-[spin_6s_linear_infinite_reverse] rounded-full border border-neon-violet/60" />
        <svg viewBox="0 0 52 52" className="h-16 w-16 drop-shadow-[0_0_8px_rgba(0,210,255,.8)]">
          <path d="M14 27 l8 8 l16 -18" fill="none" stroke="#00D2FF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"
            strokeDasharray="48" strokeDashoffset={draw ? 0 : 48} style={{ transition: "stroke-dashoffset 1s ease-out .3s" }} />
        </svg>
      </div>
      <div className="text-neon-gradient mt-6 font-display text-3xl font-bold sm:text-4xl"><ScrambleText text="СИГНАЛ ПРИНЯТ" /></div>
      <div className="hud-label mt-3">ID заявки · {id}</div>
      <p className="mt-4 max-w-md text-[#8a8a96]">Бриф передан команде AETHER. Мы вернёмся с детальным планом в течение 24 часов.</p>
      <Magnetic className="mt-8"><GlowButton onClick={onHome}>На главную</GlowButton></Magnetic>
    </div>
  );
}

function Brief({ setTab }) {
  const [step, setStep] = useState(0);
  const [dir, setDir] = useState(null);
  const [scale, setScale] = useState(null);
  const [tier, setTier] = useState(TIERS[1]);
  const [weeks, setWeeks] = useState(10);
  const [phase, setPhase] = useState("form");
  const [id] = useState(() => "BR-" + Math.floor(1000 + Math.random() * 9000));
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  const labels = ["Направление", "Масштаб", "Сроки", "Расчёт"];
  const can = step === 0 ? !!dir : step === 1 ? !!scale : true;
  const cost = dir && scale ? calcCost(dir, scale, tier, weeks) : 0;
  const submit = (e) => { e.preventDefault(); setPhase("sending"); timer.current = setTimeout(() => setPhase("sent"), 1800); };
  return (
    <>
      <PageHead label="// 05 — Бриф" title="Соберите проект" sub="Четыре шага: направление, масштаб, сроки и автоматический расчёт стоимости." />
      <BentoCard className="max-w-4xl">
        {phase === "sent" ? <HudSuccess id={id} onHome={() => setTab("home")} /> : phase === "sending" ? (
          <div className="flex flex-col items-center py-16 text-center">
            <div className="h-20 w-20 animate-spin rounded-full border-2 border-neon-blue/20 border-t-neon-blue shadow-neon-blue" />
            <div className="hud-label mt-6"><ScrambleText text="// ПЕРЕДАЧА ДАННЫХ В ЯДРО AETHER…" /></div>
          </div>
        ) : (
          <>
            <div className="mb-8 grid grid-cols-4 gap-2">
              {labels.map((l, i) => (
                <button key={l} type="button" disabled={i > step} onClick={() => setStep(i)} className="text-left disabled:cursor-default">
                  <div className={cn("h-1 rounded-full transition-all duration-500", i <= step ? "bg-neon-blue shadow-neon-blue" : "bg-white/10")} />
                  <div className={cn("mt-2 hidden font-mono text-[10px] uppercase tracking-widest sm:block", i === step ? "text-neon-blue" : "text-[#8a8a96]")}>0{i + 1} {l}</div>
                </button>
              ))}
            </div>

            <div key={step} className="animate-reveal-up">
              {step === 0 && (
                <>
                  <h3 className="mb-5 font-display text-2xl font-bold">Что строим?</h3>
                  <div className="grid gap-4 sm:grid-cols-3">{DIRS.map((d) => <Pick key={d.id} {...d} active={dir?.id === d.id} onClick={() => setDir(d)} />)}</div>
                </>
              )}
              {step === 1 && (
                <>
                  <h3 className="mb-5 font-display text-2xl font-bold">Масштаб проекта</h3>
                  <div className="grid gap-4 sm:grid-cols-3">{SCALES.map((s) => <Pick key={s.id} {...s} active={scale?.id === s.id} onClick={() => setScale(s)} />)}</div>
                </>
              )}
              {step === 2 && (
                <>
                  <h3 className="mb-5 font-display text-2xl font-bold">Сроки и пакет</h3>
                  <div className="hud-label mb-3 flex justify-between"><span>Срок реализации</span><span>{weeks} нед.</span></div>
                  <input type="range" min="4" max="24" value={weeks} onChange={(e) => setWeeks(+e.target.value)} aria-label="Срок в неделях" className="w-full accent-[#00D2FF]" />
                  <p className="mt-2 min-h-[20px] font-mono text-xs text-[#8a8a96]">{weeks < 8 ? "Срочный запуск: наценка за ускорение" : weeks > 16 ? "Спокойный темп: скидка 5%" : "Оптимальный срок"}</p>
                  <div className="mt-6 grid gap-4 sm:grid-cols-3">{TIERS.map((t) => <Pick key={t.id} {...t} active={tier.id === t.id} onClick={() => setTier(t)} />)}</div>
                </>
              )}
              {step === 3 && (
                <div className="grid gap-6 md:grid-cols-2">
                  <div className="rounded-2xl border border-neon-blue/30 bg-neon-blue/[0.05] p-6">
                    <div className="hud-label mb-3">// Оценка стоимости</div>
                    <div className="text-neon-gradient font-display text-5xl font-bold sm:text-6xl"><Count to={cost} prefix="€ " /></div>
                    <div className="mt-2 font-mono text-xs text-[#8a8a96]">Диапазон: € {fmt(cost * 0.9)} — € {fmt(cost * 1.12)}</div>
                    <div className="mt-5 flex flex-wrap gap-2">
                      {[dir.title, scale.title, tier.title, `${weeks} нед.`].map((t) => <span key={t} className="rounded-full border border-neon-blue/30 bg-neon-blue/10 px-3 py-1 font-mono text-xs text-neon-blue">{t}</span>)}
                    </div>
                  </div>
                  <form onSubmit={submit} className="space-y-4">
                    <input required className="field" placeholder="Ваше имя" />
                    <input required type="email" className="field" placeholder="Email" />
                    <textarea rows="3" className="field" placeholder="Комментарий к проекту (необязательно)" />
                    <GlowButton type="submit" className="w-full">Отправить бриф →</GlowButton>
                  </form>
                </div>
              )}
            </div>

            <div className="mt-8 flex items-center justify-between">
              <button type="button" onClick={() => setStep(step - 1)} className={cn("text-sm text-[#8a8a96] transition-colors hover:text-white", step === 0 && "invisible")}>← Назад</button>
              {step < 3 && (
                <Magnetic strength={0.2}>
                  <GlowButton onClick={() => setStep(step + 1)} disabled={!can} className="disabled:cursor-not-allowed disabled:opacity-40">Далее →</GlowButton>
                </Magnetic>
              )}
            </div>
          </>
        )}
      </BentoCard>
    </>
  );
}

/* ================= app ================= */
function App() {
  const [tab, setTab] = useState("home");
  const [ready, setReady] = useState(false);
  const onReady = useCallback(() => setReady(true), []);
  useEffect(() => { window.scrollTo({ top: 0 }); }, [tab]);
  const pages = { services: <Services />, cases: <Cases />, metrics: <Metrics />, dashboard: <><Dashboard /><Playground /></>, brief: <Brief setTab={setTab} /> };
  return (
    <>
      <HudCursor />
      <div className="noise" />
      <div className={cn("pointer-events-none fixed inset-0 z-0 transition-opacity duration-1000", !ready ? "opacity-0" : tab === "home" ? "opacity-100" : "opacity-30")}>
        <HeroSphere onReady={onReady} />
      </div>
      {!ready && <div className="fixed inset-0 z-0"><HeroLoader /></div>}
      <Nav tab={tab} setTab={setTab} />
      <main key={tab} className="relative z-10">
        {tab === "home" ? <Hero setTab={setTab} /> : (
          <section className="mx-auto w-full max-w-[1320px] px-5 pb-32 pt-36 sm:px-8 lg:px-12">{pages[tab]}</section>
        )}
      </main>
      <nav className="glass fixed inset-x-3 z-50 flex justify-around rounded-full px-2 py-2.5 text-[11px] md:hidden" style={{ bottom: "calc(env(safe-area-inset-bottom,0px) + 12px)" }}>
        {[["home", "Главная"], ...NAV, ["brief", "Бриф"]].map(([id, l]) => (
          <a key={id} href="#top" onClick={(e) => { e.preventDefault(); setTab(id); }} className={tab === id ? "text-neon-blue" : "text-[#8a8a96]"}>{l}</a>
        ))}
      </nav>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
